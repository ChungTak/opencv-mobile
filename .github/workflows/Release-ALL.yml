name: Release Build ALL Platforms

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Group 1: Generic Linux platforms (except RISC-V)
          # - group: linux
          #   target: x86_64-linux-gnu
          #   os: ubuntu-22.04
          # - group: linux
          #   target: aarch64-linux-gnu
          #   os: ubuntu-22.04
          # - group: linux
          #   target: loongarch64-linux-gnu
          #   os: ubuntu-22.04

          # # Group 2: RISC-V (separate because it has special requirements)
          # - group: riscv
          #   target: riscv64-linux-gnu
          #   os: ubuntu-22.04
            
          # # Group 3: Windows platforms
          # - group: windows
          #   target: x86_64-windows-gnu
          #   os: windows-2022
          # - group: windows
          #   target: aarch64-windows-gnu
          #   os: windows-2022
            
          # # Group 4: macOS platforms
          # - group: macos
          #   target: x86_64-macos
          #   os: macos-13
          # - group: macos
          #   target: aarch64-macos
          #   os: macos-13
            
          # # Group 5: Android platforms
          # - group: android
          #   target: aarch64-linux-android
          #   os: ubuntu-22.04
          # - group: android
          #   target: arm-linux-android
          #   os: ubuntu-22.04
          # - group: android
          #   target: x86-linux-android
          #   os: ubuntu-22.04
          # - group: android
          #   target: x86_64-linux-android
          #   os: ubuntu-22.04

         # Group 6: HarmonyOS platforms
          - group: harmonyos
            target: aarch64-linux-harmonyos
            os: ubuntu-22.04
          # - group: harmonyos
          #   target: arm-linux-harmonyos
          #   os: ubuntu-22.04
          # - group: harmonyos
          #   target: x86_64-linux-harmonyos
          #   os: ubuntu-22.04          

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      PATH_VERSION: r32
      OPENCV_VERSION: 4.11.0
      OPENCV_ZIP_URL: https://github.com/nihui/opencv-mobile/releases/download/v32/opencv-mobile-4.11.0.zip
      OPENCV_ZIP_FILE: opencv-mobile-4.11.0.zip
      OPENCV_DIR: opencv-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: zig-build
          fetch-depth: 0

      # Setup Android NDK for Android targets
      - name: Setup Android NDK
        if: matrix.group == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true
          add-to-path: true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Install build dependencies (HarmonyOS)
        if: matrix.group == 'harmonyos'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake unzip curl
        
      - name: Setup HarmonyOS SDK
        if: matrix.group == 'harmonyos'
        shell: bash
        run: |
          echo "Downloading HarmonyOS SDK split archives..."
          curl -L -o ohos-sdk-windows_linux-public.tar.gz.aa https://github.com/openharmony-rs/ohos-sdk/releases/download/v4.1/ohos-sdk-windows_linux-public.tar.gz.aa
          curl -L -o ohos-sdk-windows_linux-public.tar.gz.ab https://github.com/openharmony-rs/ohos-sdk/releases/download/v4.1/ohos-sdk-windows_linux-public.tar.gz.ab
          echo "Combining split archives..."
          cat ohos-sdk-windows_linux-public.tar.gz.aa ohos-sdk-windows_linux-public.tar.gz.ab > ohos-sdk-windows_linux-public.tar.gz
          echo "Extracting HarmonyOS SDK..."
          tar -xzf ohos-sdk-windows_linux-public.tar.gz
          export HARMONYOS_SDK_HOME=$(find $(pwd)/ohos-sdk/linux -type d -name native | head -n 1)
          echo "HARMONYOS_SDK_HOME=$HARMONYOS_SDK_HOME" >> $GITHUB_ENV
          if [ ! -f "$HARMONYOS_SDK_HOME/build/cmake/ohos.toolchain.cmake" ]; then
            echo "::error::HarmonyOS toolchain file not found at $HARMONYOS_SDK_HOME/build/cmake/ohos.toolchain.cmake"
            exit 1
          fi
          echo "HarmonyOS SDK setup complete."

      - name: Download and Extract OpenCV Mobile
        shell: bash
        run: |
          echo "Downloading OpenCV from ${{ env.OPENCV_ZIP_URL }}..."
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # --- Windows ---
            echo "Running curl/unzip commands for download and extraction..."
            curl -L -o "${{ env.OPENCV_ZIP_FILE }}" "${{ env.OPENCV_ZIP_URL }}"
            echo "Extracting OpenCV using unzip..."
            unzip "${{ env.OPENCV_ZIP_FILE }}"

            echo "Checking and renaming extracted directory (bash)..."
            extracted_dir_with_version="opencv-mobile-${{ env.OPENCV_VERSION }}"
            target_dir="${{ env.OPENCV_DIR }}"
            echo "Checking for '$extracted_dir_with_version' and '$target_dir'"
            if [ -d "$extracted_dir_with_version" ]; then
               echo "Found '$extracted_dir_with_version', renaming to '$target_dir'..."
               mv "$extracted_dir_with_version" "$target_dir"
               echo "Renamed."
            elif [ ! -d "$target_dir" ]; then
              echo "::error::Directory '$target_dir' not found after extraction, and '$extracted_dir_with_version' was not found either."
              exit 1
            else
               echo "Directory '$target_dir' already exists or was named correctly during extraction."
            fi
          else
            # --- Linux/macOS ---
            echo "Running curl/unzip commands for download and extraction..."
            curl -L -o "${{ env.OPENCV_ZIP_FILE }}" "${{ env.OPENCV_ZIP_URL }}"
            echo "Extracting OpenCV using unzip..."
            unzip "${{ env.OPENCV_ZIP_FILE }}"

            echo "Checking and renaming extracted directory (bash)..."
            extracted_dir_with_version="opencv-mobile-${{ env.OPENCV_VERSION }}"
            target_dir="${{ env.OPENCV_DIR }}"
            echo "Checking for '$extracted_dir_with_version' and '$target_dir'"
            if [ -d "$extracted_dir_with_version" ]; then
               echo "Found '$extracted_dir_with_version', renaming to '$target_dir'..."
               mv "$extracted_dir_with_version" "$target_dir"
               echo "Renamed."
            elif [ ! -d "$target_dir" ]; then
              echo "::error::Directory '$target_dir' not found after extraction, and '$extracted_dir_with_version' was not found either."
              exit 1
            else
               echo "Directory '$target_dir' already exists or was named correctly during extraction."
            fi
          fi

          echo "OpenCV should now be in '${{ env.OPENCV_DIR }}'"
          ls -l
          echo "Cleaning up zip file..."
          rm "${{ env.OPENCV_ZIP_FILE }}"
          echo "Cleanup complete."

      # --- Linux Specific Setup ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux' && (matrix.group == 'linux' || matrix.group == 'riscv')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            unzip \
            curl \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross

      # Additional LoongArch64 setup if needed
      - name: Install LoongArch64 Dependencies
        if: matrix.target == 'loongarch64-linux-gnu'
        run: |
          # Add any specific LoongArch64 dependencies here if needed
          echo "Setting up LoongArch64 environment"

      # --- Windows Specific Setup ---
      - name: Setup MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolchain: vs2022

      - name: Setup Git Bash for Windows
        if: runner.os == 'Windows'
        run: |
          choco install git -y
          # Ensure Git Bash is available in PATH
          echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      # --- macOS Specific Setup ---
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake curl unzip

      # --- Common Setup ---
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.14.0

      - name: Set Last Commit Date (YYYY-MM-DD)
        id: last-commit-date
        run: echo "LAST_COMMIT_DATE=$(git log -1 --format=%cs)" >> $GITHUB_ENV
        shell: bash

      # Store env variables for artifact-naming and release creation
      - name: Create environment variables file for release job
        run: |
          echo "PATH_VERSION=${{ env.PATH_VERSION }}" > build_env.txt
          echo "OPENCV_VERSION=${{ env.OPENCV_VERSION }}" >> build_env.txt
          echo "LAST_COMMIT_DATE=${{ env.LAST_COMMIT_DATE }}" >> build_env.txt
        shell: bash

      - name: Upload environment variables
        uses: actions/upload-artifact@v4
        with:
          name: build-environment
          path: build_env.txt
          retention-days: 1

      # --- Build Step (All platforms using bash) ---
      - name: Build for ${{ matrix.target }}
        run: |
          export OUTPUT_DIR="install_opencv_${{ matrix.target }}"
          export OPENCV_INSTALL_DIR=$(pwd)/${{ env.OPENCV_DIR }}/${{ matrix.target }}

          chmod +x build_with_zig.sh
          ./build_with_zig.sh --target=${{ matrix.target }}

          # --- Packaging ---
          if [ -d "$OUTPUT_DIR" ]; then
            RELEASE_NAME="opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}"
            mkdir -p release/artifacts
            mv "$OUTPUT_DIR" "release/artifacts/$RELEASE_NAME"
            echo "Creating archive release/artifacts/$RELEASE_NAME.tar.gz"
            tar -czvf "release/artifacts/$RELEASE_NAME.tar.gz" -C "release/artifacts" "$RELEASE_NAME"
            echo "Archive created."
          else
            echo "::error::Output directory $OUTPUT_DIR not found!"
            exit 1
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.target }}
          path: release/artifacts/opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout Repository (for release notes context)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download build environment variables
        uses: actions/download-artifact@v4
        with:
          name: build-environment
          path: ./

      - name: Load environment variables
        run: |
          if [ -f "build_env.txt" ]; then
            echo "Loading environment variables from build_env.txt"
            cat build_env.txt >> $GITHUB_ENV
            cat build_env.txt # Debugging output
          else
            echo "::error::build_env.txt not found!"
            exit 1
          fi
        shell: bash

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-artifact-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ env.PATH_VERSION }}
          name: OpenCV Mobile Release ${{ env.PATH_VERSION }} (${{ env.LAST_COMMIT_DATE }})
          body: |
            Automatic build triggered by workflow dispatch.
            Build artifacts based on zig-build branch commit associated with run ID ${{ github.run_id }}.
            Release tagged on master branch commit ${{ github.sha }}.
            OpenCV Version: ${{ env.OPENCV_VERSION }}
            Build Version: ${{ env.PATH_VERSION }}
          draft: false
          prerelease: false
          overwrite: true
          files: |
            release-artifacts/*.tar.gz