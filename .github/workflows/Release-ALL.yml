name: Release Build ALL Platforms

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Group 1: Generic Linux platforms (except RISC-V)
          # - group: linux
          #   target: x86_64-linux-gnu
          #   os: ubuntu-22.04
          # - group: linux
          #   target: aarch64-linux-gnu
          #   os: ubuntu-22.04
          # - group: linux
          #   target: loongarch64-linux-gnu
          #   os: ubuntu-22.04

          # # Group 2: RISC-V (separate because it has special requirements)
          # - group: riscv
          #   target: riscv64-linux-gnu
          #   os: ubuntu-22.04
            
          # # Group 3: Windows platforms
          # - group: windows
          #   target: x86_64-windows-gnu
          #   os: windows-2022
          # - group: windows
          #   target: aarch64-windows-gnu
          #   os: windows-2022
            
          # # Group 4: macOS platforms
          # - group: macos
          #   target: x86_64-macos
          #   os: macos-13
          # - group: macos
          #   target: aarch64-macos
          #   os: macos-13
            
          # # Group 5: Android platforms
          # - group: android
          #   target: aarch64-linux-android
          #   os: ubuntu-22.04
          # - group: android
          #   target: arm-linux-android
          #   os: ubuntu-22.04
          # - group: android
          #   target: x86-linux-android
          #   os: ubuntu-22.04
          - group: android
            target: x86_64-linux-android
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      PATH_VERSION: r32
      OPENCV_VERSION: 4.11.0
      OPENCV_ZIP_URL: https://github.com/nihui/opencv-mobile/releases/download/v32/opencv-mobile-4.11.0.zip
      OPENCV_ZIP_FILE: opencv-mobile-4.11.0.zip
      OPENCV_DIR: opencv-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: zig-build
          fetch-depth: 0 # Get all commits and tags

      # Setup Android NDK for Android targets
      - name: Setup Android NDK
        if: matrix.group == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true
          add-to-path: true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Download and Extract OpenCV Mobile
        shell: bash
        run: |
          echo "Downloading OpenCV from ${{ env.OPENCV_ZIP_URL }}..."
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # --- Windows ---
            echo "Running PowerShell commands for download and extraction..."
            powershell -Command "Invoke-WebRequest -Uri '${{ env.OPENCV_ZIP_URL }}' -OutFile '${{ env.OPENCV_ZIP_FILE }}'"

            echo "Extracting OpenCV using PowerShell..."
            powershell -Command "Expand-Archive -Path '${{ env.OPENCV_ZIP_FILE }}' -DestinationPath '.' -Force"

            echo "Checking and renaming extracted directory (PowerShell)..."
            # Encapsulate the conditional logic within powershell -Command
            powershell -Command "
              \$extractedDirWithVersion = 'opencv-mobile-${{ env.OPENCV_VERSION }}'
              \$targetDir = '${{ env.OPENCV_DIR }}'
              Write-Host \"Checking for '\$extractedDirWithVersion' and '\$targetDir'\"
              if (Test-Path \$extractedDirWithVersion) {
                  Write-Host \"Found '\$extractedDirWithVersion', renaming to '\$targetDir'...\"
                  Move-Item -Path \$extractedDirWithVersion -Destination \$targetDir -Force
                  Write-Host \"Renamed.\"
              } elseif (-Not (Test-Path \$targetDir)) {
                  Write-Error \"Directory '\$targetDir' not found after extraction, and '\$extractedDirWithVersion' was not found either.\"
                  exit 1 # Fail the step
              } else {
                  Write-Host \"Directory '\$targetDir' already exists or was named correctly during extraction.\"
              }
            "
            # Check if the powershell command above exited with an error
            if [[ $? -ne 0 ]]; then
              echo "::error::PowerShell directory check/rename failed."
              exit 1
            fi

          else
            # --- Linux/macOS ---
            echo "Running curl/unzip commands for download and extraction..."
            curl -L -o "${{ env.OPENCV_ZIP_FILE }}" "${{ env.OPENCV_ZIP_URL }}"
            echo "Extracting OpenCV using unzip..."
            unzip "${{ env.OPENCV_ZIP_FILE }}"

            echo "Checking and renaming extracted directory (bash)..."
            extracted_dir_with_version="opencv-mobile-${{ env.OPENCV_VERSION }}"
            target_dir="${{ env.OPENCV_DIR }}"
            echo "Checking for '$extracted_dir_with_version' and '$target_dir'"
            if [ -d "$extracted_dir_with_version" ]; then
               echo "Found '$extracted_dir_with_version', renaming to '$target_dir'..."
               mv "$extracted_dir_with_version" "$target_dir"
               echo "Renamed."
            elif [ ! -d "$target_dir" ]; then
              echo "::error::Directory '$target_dir' not found after extraction, and '$extracted_dir_with_version' was not found either."
              exit 1
            else
               echo "Directory '$target_dir' already exists or was named correctly during extraction."
            fi
          fi

          echo "OpenCV should now be in '${{ env.OPENCV_DIR }}'"
          ls -l # List files to help debug if needed
          echo "Cleaning up zip file..."
          rm "${{ env.OPENCV_ZIP_FILE }}"
          echo "Cleanup complete."

      # --- Linux Specific Setup ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux' && (matrix.group == 'linux' || matrix.group == 'riscv')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            unzip \
            curl \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross

      # Additional LoongArch64 setup if needed
      - name: Install LoongArch64 Dependencies
        if: matrix.target == 'loongarch64-linux-gnu'
        run: |
          # Add any specific LoongArch64 dependencies here if needed
          echo "Setting up LoongArch64 environment"

      # --- Windows Specific Setup ---
      - name: Setup MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolchain: vs2022

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      # --- macOS Specific Setup ---
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake curl unzip

      # --- Common Setup ---
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.14.0

      - name: Set Last Commit Date (YYYY-MM-DD)
        id: last-commit-date
        run: echo "LAST_COMMIT_DATE=$(git log -1 --format=%cs)" >> $GITHUB_ENV
        shell: bash # Ensure command runs on all platforms

      # --- Build Step (OS Specific) ---
      - name: Build for ${{ matrix.target }} (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          export OUTPUT_DIR="install_opencv_${{ matrix.target }}"
          export OPENCV_INSTALL_DIR=$(pwd)/${{ env.OPENCV_DIR }}/${{ matrix.target }}

          chmod +x build_with_zig.sh # Ensure script is executable
          # Pass OpenCV path to script, assuming script accepts --opencv_dir parameter
          ./build_with_zig.sh --target=${{ matrix.target }}

          # --- Packaging ---
          if [ -d "$OUTPUT_DIR" ]; then
            RELEASE_NAME="opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}"
            mkdir -p release/artifacts # Ensure directory exists
            mv "$OUTPUT_DIR" "release/artifacts/$RELEASE_NAME"
            echo "Creating archive release/artifacts/$RELEASE_NAME.tar.gz"
            tar -czvf "release/artifacts/$RELEASE_NAME.tar.gz" -C "release/artifacts" "$RELEASE_NAME"
            echo "Archive created."
          else
            echo "::error::Output directory $OUTPUT_DIR not found!"
            exit 1
          fi
        shell: bash

      - name: Build for ${{ matrix.target }} (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:OUTPUT_DIR = "install_opencv_${{ matrix.target }}"
          # Set environment variables in PowerShell to pass to script
          $env:OPENCV_INSTALL_DIR = Join-Path (Get-Location).Path "${{ env.OPENCV_DIR }}\${{ matrix.target }}"

          Write-Host "Running PowerShell build script..."
          # Pass OpenCV path to script, assuming script accepts -opencv_dir parameter
          powershell -ExecutionPolicy Bypass -File ./build_with_zig.ps1 -target ${{ matrix.target }}

          # --- Packaging ---
          if (Test-Path $env:OUTPUT_DIR) {
            $RELEASE_NAME="opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}"
            New-Item -ItemType Directory -Force -Path "release/artifacts" # Ensure directory exists
            Move-Item -Path $env:OUTPUT_DIR -Destination "release/artifacts/$RELEASE_NAME"
            echo "Creating archive release/artifacts/$RELEASE_NAME.tar.gz"
            # Use tar on Windows (usually available from Git Bash or system)
            tar -czvf "release/artifacts/$RELEASE_NAME.tar.gz" -C "release/artifacts" "$RELEASE_NAME"
            echo "Archive created."
          } else {
            Write-Error "Output directory $($env:OUTPUT_DIR) not found!"
            exit 1
          }
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.target }} # One artifact per target
          # Upload the tar.gz file created in the build step
          path: release/artifacts/opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-22.04
    needs: build # Wait for all build jobs to complete
    permissions:
      contents: write
    steps:
      - name: Checkout Repository (for release notes context)
        uses: actions/checkout@v4
        with:
          # Note: Checkout is on master, but builds are done on zig-build branch
          # This means Release Notes SHA points to master, but artifacts come from zig-build
          ref: master
          fetch-depth: 0 # Get all history for release notes

      - name: Set Last Commit Date (YYYY-MM-DD)
        id: last-commit-date
        # Date needed in release job too, but based on last commit to master branch
        run: echo "LAST_COMMIT_DATE=$(git log -1 --format=%cs)" >> $GITHUB_ENV
        shell: bash

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts # All artifacts downloaded to this directory
          pattern: release-artifact-* # Match all target artifacts
          merge-multiple: true # Merge all artifacts to the directory specified by path

      - name: List downloaded files # Debug step to confirm files were downloaded
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use date or commit sha to ensure tag uniqueness if PATH_VERSION doesn't change
          tag_name: release-${{ env.PATH_VERSION }}-${{ env.LAST_COMMIT_DATE }} # e.g., release-r32-2025-04-08
          name: OpenCV Mobile Release ${{ env.PATH_VERSION }} (${{ env.LAST_COMMIT_DATE }})
          body: |
            Automatic build triggered by workflow dispatch.
            Build artifacts based on zig-build branch commit associated with run ID ${{ github.run_id }}.
            Release tagged on master branch commit ${{ github.sha }}.
            OpenCV Version: ${{ env.OPENCV_VERSION }}
            Build Version: ${{ env.PATH_VERSION }}
          draft: false
          prerelease: false
          overwrite: true # Overwrite Tag and Release with same name
          files: |
            release-artifacts/*.tar.gz