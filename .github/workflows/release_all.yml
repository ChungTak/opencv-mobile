name: Release Build ALL Platforms

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-linux-gnu
            os: ubuntu-22.04
          - target: riscv64-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-windows-gnu
            os: windows-2022
          - target: aarch64-windows-gnu
            os: windows-2022
          - target: x86_64-macos
            os: macos-13 # 或者指定版本如 macos-13, macos-14
          - target: aarch64-macos
            os: macos-13 # 或者指定版本如 macos-13, macos-14
    runs-on: ${{ matrix.os }} # 动态设置运行环境
    permissions:
      contents: write
    env:
      # BUILD_DATE: ${{ github.workflow }}-${{ github.run_id }}-$(date -u +'%Y_%m_%d') # 使用下面的 LAST_COMMIT_DATE
      PATH_VERSION: r32
      OPENCV_VERSION: 4.11.0
      OPENCV_ZIP_URL: https://github.com/nihui/opencv-mobile/releases/download/v32/opencv-mobile-4.11.0.zip
      OPENCV_ZIP_FILE: opencv-mobile-4.11.0.zip
      OPENCV_DIR: opencv-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: zig-build
          fetch-depth: 0 # 获取所有提交和Tag

      - name: Download and Extract OpenCV Mobile
        shell: bash # 使用 bash 以便跨平台使用 curl 和 unzip/Expand-Archive 条件判断
        run: |
          echo "Downloading OpenCV from ${{ env.OPENCV_ZIP_URL }}..."
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "Invoke-WebRequest -Uri ${{ env.OPENCV_ZIP_URL }} -OutFile ${{ env.OPENCV_ZIP_FILE }}"
            echo "Extracting OpenCV using PowerShell..."
            powershell -Command "Expand-Archive -Path ${{ env.OPENCV_ZIP_FILE }} -DestinationPath . -Force"
            # Powershell 可能解压到带版本号的目录，重命名确保一致
            # 注意：这里假设解压后的根目录名包含版本号，如果不是，请调整
            if (Test-Path "opencv-mobile-${{ env.OPENCV_VERSION }}") {
              powershell -Command "Move-Item -Path opencv-mobile-${{ env.OPENCV_VERSION }} -Destination ${{ env.OPENCV_DIR }}"
            } elseif (-Not (Test-Path "${{ env.OPENCV_DIR }}")) {
              echo "::error::Expected extracted directory not found after PowerShell extraction."
              exit 1
            }
          else
            curl -L -o "${{ env.OPENCV_ZIP_FILE }}" "${{ env.OPENCV_ZIP_URL }}"
            echo "Extracting OpenCV using unzip..."
            unzip "${{ env.OPENCV_ZIP_FILE }}"
            # Unzip 可能解压到带版本号的目录，重命名确保一致
            # 注意：这里假设解压后的根目录名包含版本号，如果不是，请调整
            if [ -d "opencv-mobile-${{ env.OPENCV_VERSION }}" ]; then
               mv "opencv-mobile-${{ env.OPENCV_VERSION }}" "${{ env.OPENCV_DIR }}"
            elif [ ! -d "${{ env.OPENCV_DIR }}" ]; then
              echo "::error::Expected extracted directory not found after unzip."
              exit 1
            fi
          fi
          echo "OpenCV extracted to ${{ env.OPENCV_DIR }}"
          rm "${{ env.OPENCV_ZIP_FILE }}" # 清理 zip 文件

      # --- Linux Specific Setup ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            unzip \
            curl \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross

      # --- Windows Specific Setup ---
      - name: Setup MSVC 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolchain: vs2022 # 确保与你的项目需求匹配

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      # --- macOS Specific Setup ---
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake curl unzip

      # --- Common Setup ---
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.14.0

      - name: Set Last Commit Date (YYYY-MM-DD)
        id: last-commit-date
        run: echo "LAST_COMMIT_DATE=$(git log -1 --format=%cs)" >> $GITHUB_ENV
        shell: bash # 保证命令在所有平台运行

      # --- Build Step (OS Specific) ---
      - name: Build for ${{ matrix.target }} (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          export OUTPUT_DIR="install_opencv_${{ matrix.target }}"
          export OPENCV_INSTALL_DIR=$(pwd)/${{ env.OPENCV_DIR }}/${{ matrix.target }} # 传递解压后的 OpenCV 路径给构建脚本

          chmod +x build_with_zig.sh # 确保脚本可执行
          # 传递 OpenCV 路径给脚本，假设脚本接受 --opencv_dir 参数
          ./build_with_zig.sh --target=${{ matrix.target }} --opencv_dir=${OPENCV_INSTALL_DIR}

          # --- Packaging ---
          if [ -d "$OUTPUT_DIR" ]; then
            RELEASE_NAME="opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}"
            mkdir -p release/artifacts # 确保目录存在
            mv "$OUTPUT_DIR" "release/artifacts/$RELEASE_NAME"
            echo "Creating archive release/artifacts/$RELEASE_NAME.tar.gz"
            tar -czvf "release/artifacts/$RELEASE_NAME.tar.gz" -C "release/artifacts" "$RELEASE_NAME"
            echo "Archive created."
          else
            echo "::error::Output directory $OUTPUT_DIR not found!"
            exit 1
          fi
        shell: bash

      - name: Build for ${{ matrix.target }} (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:OUTPUT_DIR = "install_opencv_${{ matrix.target }}"
          # PowerShell 中设置环境变量并传递给脚本
          $env:OPENCV_INSTALL_DIR = Join-Path (Get-Location).Path "${{ env.OPENCV_DIR }}\${{ matrix.target }}"

          Write-Host "Running PowerShell build script..."
          # 传递 OpenCV 路径给脚本，假设脚本接受 -opencv_dir 参数
          powershell -ExecutionPolicy Bypass -File ./build_with_zig.ps1 -target ${{ matrix.target }} -opencv_dir $env:OPENCV_INSTALL_DIR

          # --- Packaging ---
          if (Test-Path $env:OUTPUT_DIR) {
            $RELEASE_NAME="opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}"
            New-Item -ItemType Directory -Force -Path "release/artifacts" # 确保目录存在
            Move-Item -Path $env:OUTPUT_DIR -Destination "release/artifacts/$RELEASE_NAME"
            echo "Creating archive release/artifacts/$RELEASE_NAME.tar.gz"
            # 在 Windows 上使用 tar (通常 Git Bash 或系统自带的)
            tar -czvf "release/artifacts/$RELEASE_NAME.tar.gz" -C "release/artifacts" "$RELEASE_NAME"
            echo "Archive created."
          } else {
            Write-Error "Output directory $($env:OUTPUT_DIR) not found!"
            exit 1
          }
        shell: powershell

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.target }} # 每个 target 一个 artifact
          # 上传构建步骤中创建的正确的 tar.gz 文件
          path: release/artifacts/opencv-mobile-${{ env.OPENCV_VERSION }}-${{ env.PATH_VERSION }}-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-22.04
    needs: build # 等待所有 build job 完成
    permissions:
      contents: write
    # 只有在 master 分支或者特定 tag 推送时才触发 release (如果需要)
    # if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository (for release notes context)
        uses: actions/checkout@v4
        with:
          # 注意：这里 checkout 的是 master，但构建是在 zig-build 分支上进行的
          # 这意味着 Release Notes 中的 SHA 指向 master，但制品来自 zig-build
          ref: master
          fetch-depth: 0 # 获取所有历史用于 release notes

      - name: Set Last Commit Date (YYYY-MM-DD)
        id: last-commit-date
        # 在 release job 中也需要日期，但这次基于 master 分支的最后提交
        run: echo "LAST_COMMIT_DATE=$(git log -1 --format=%cs)" >> $GITHUB_ENV
        shell: bash

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts # 所有 artifact 下载到此目录
          pattern: release-artifact-* # 匹配所有 target 的 artifact
          merge-multiple: true # 将所有 artifact 合并到 path 指定的目录

      - name: List downloaded files # 调试步骤，确认文件已下载
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 使用日期或 commit sha 来确保 tag 唯一性，如果 PATH_VERSION 不变的话
          tag_name: release-${{ env.PATH_VERSION }}-${{ env.LAST_COMMIT_DATE }} # 例如 release-r32-2025-04-08
          name: OpenCV Mobile Release ${{ env.PATH_VERSION }} (${{ env.LAST_COMMIT_DATE }})
          body: |
            Automatic build triggered by workflow dispatch.
            Build artifacts based on zig-build branch commit associated with run ID ${{ github.run_id }}.
            Release tagged on master branch commit ${{ github.sha }}.
            OpenCV Version: ${{ env.OPENCV_VERSION }}
            Build Version: ${{ env.PATH_VERSION }}
          draft: false
          prerelease: false
          overwrite: true # 覆盖同名 Tag 和 Release
          files: |
            release-artifacts/*.tar.gz
